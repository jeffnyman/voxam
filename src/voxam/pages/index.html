<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>VOXAM_TITLE</title>
<link rel="stylesheet" href="glkote.css" type="text/css">
<style type="text/css">
html, body {
  margin: 0;
  height: 100%;
  background: #444;
}
#gameport {
  position: absolute;
  overflow: hidden;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 900px;
  top: 0;
  bottom: 0;
  background: white;
}
/* The Z-Machine's reverse video (§8.7) travels as user1, and its
   status grid wears the classic inverse bar. */
.Style_user1 {
  background: #333;
  color: #fff;
}
.GridWindow {
  background: #333;
  color: #fff;
}
.GridWindow .Style_user1 {
  background: #fff;
  color: #333;
}
</style>
<script src="jquery-1.12.4.min.js" type="text/javascript"></script>
<script src="glkote.js" type="text/javascript"></script>
<script type="text/javascript">
/* The Game interface object GlkOte drives: every event becomes
   one POST, and the response body is the update -- the burst
   model, one exchange per turn. Pict numbers resolve to the
   server's own /pict road, so image operations need no urls. */
var Game = {
  accept: function(event) {
    fetch("/event", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(event)
    }).then(function(response) {
      return response.json();
    }).then(function(update) {
      GlkOte.update(update);
    }).catch(function(fault) {
      GlkOte.error("The session was lost: " + fault);
    });
  },
  Blorb: {
    get_image_url: function(number) { return "/pict/" + number; }
  }
};
</script>
</head>
<body onload="GlkOte.init();">
<div id="gameport">
<div id="windowport">
<noscript><p>You must have Javascript turned on to play.</p></noscript>
</div>
<div id="loadingpane">
<img src="waiting.gif" alt="LOADING"><br>
<em>Loading...</em>
</div>
<div id="errorpane" style="display:none;"><div id="errorcontent">...</div></div>
</div>
</body>
</html>
