<!doctype html>
<html lang="en" data-theme="system">
<head>
<meta charset="utf-8">
<title>VOXAM_TITLE</title>
<link rel="icon" href="favicon.ico" type="image/x-icon">
<link rel="stylesheet" href="glkote.css" type="text/css">
<script src="voxam-prefs.js" type="text/javascript"></script>
<script type="text/javascript">
/* Wear the kept choices before the first paint, so a chosen ink or
   size never flashes the default on its way in. The panel itself
   waits for the body; this cannot. */
try {
  var VOXAM_KEPT = JSON.parse(localStorage.getItem("voxam-display") || "null");

  if (!VOXAM_KEPT) {
    /* The ink alone was kept under its own key before the panel
       existed; a reader who chose one keeps it. */
    VOXAM_KEPT = { theme: localStorage.getItem("voxam-theme") };
  }

  VoxamPrefs.apply(VoxamPrefs.sound(VOXAM_KEPT));
} catch (e) {
  /* Private mode, blocked storage: the defaults stand. */
}
</script>
<style type="text/css">
/* The inks. "paper" is the default and what a light system wears
   under "system"; a dark system swaps in the dark palette unless
   a theme was picked outright. Each ink is a whole dress -- page,
   window, the reverse video §8.7 sends as user1, and the §8.2
   status bar.

   The bar names its own pair rather than inverting the story's.
   Deriving it by inversion looks right until the upper window is
   itself dressed as the story's inverse: the status line is
   reverse video from end to end, so it inverts a second time and
   lands back on the story's own colours -- which is how the sepia
   bar came to be pixel-for-pixel identical to the prose beneath
   it. So --bar and --bar-ink are chosen per ink, the way WinFrotz
   chooses white on blue, and the grid itself simply wears the
   story's paper, because an upper window is part of the same
   screen. */
:root {
  --story-face: Palatino, Georgia, "Times New Roman", Times, serif;
  --story-size: 15px;
  --grid-size: 14px;
  --leading: 1.4;
  --letters: 0em;
  --words: 0em;
  --measure: 98ch;
  --page: #444;
  --paper: #fff;
  --ink: #000;
  --band: #333;
  --band-ink: #fff;
  --bar: #2b2b2b;
  --bar-ink: #f2f2f2;
  --quote: #fff0c0;
  --link: #1a5fb4;
}
@media (prefers-color-scheme: dark) {
  html[data-theme="system"] {
    --page: #111;
    --paper: #1c1c1c;
    --ink: #d6d6d6;
    --band: #d6d6d6;
    --band-ink: #1c1c1c;
    --bar: #a8a8a8;
    --bar-ink: #141414;
    --quote: #ffffff14;
    --link: #8ab4f8;
  }
}
html[data-theme="dark"] {
  --page: #111;
  --paper: #1c1c1c;
  --ink: #d6d6d6;
  --band: #d6d6d6;
  --band-ink: #1c1c1c;
  --bar: #a8a8a8;
  --bar-ink: #141414;
  --quote: #ffffff14;
  --link: #8ab4f8;
}
html[data-theme="sepia"] {
  --page: #2f2921;
  --paper: #f4ecd8;
  --ink: #43382a;
  --band: #43382a;
  --band-ink: #f4ecd8;
  --bar: #43382a;
  --bar-ink: #f4ecd8;
  --quote: #0000000f;
  --link: #7a5326;
}
/* The DOS Infocom look, which WinFrotz still opens in: white on a
   deep blue, and the status bar its exact inverse. The one ink
   here that is a period piece rather than a reading preference. */
html[data-theme="frotz"] {
  --page: #000042;
  --paper: #000084;
  --ink: #fff;
  --band: #fff;
  --band-ink: #000084;
  --bar: #fff;
  --bar-ink: #000084;
  --quote: #ffffff1f;
  --link: #7ec8ff;
}
html, body {
  margin: 0;
  height: 100%;
  background: var(--page);
}
#gameport {
  position: absolute;
  overflow: hidden;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: var(--measure);
  font-family: var(--story-face);
  font-size: var(--story-size);
  top: 0;
  bottom: 0;
  background: var(--paper);
  color: var(--ink);
}
/* GlkOte's own stylesheet paints windows a hardcoded cream; the
   theme's paper wins here. */
.BufferWindow, .BufferWindow .Input {
  font-family: var(--story-face);
  font-size: var(--story-size);
  line-height: var(--leading);
  letter-spacing: var(--letters);
  word-spacing: var(--words);
}
.GridWindow, .GridWindow .Input {
  font-size: var(--grid-size);
}
.WindowFrame {
  background: var(--paper);
}
.GraphicsWindow canvas {
  background-color: var(--paper);
}
/* The Z-Machine's reverse video (§8.7) travels as user1. In the
   buffer it inverts the story, as reverse video should. The grid
   wears the story's own paper, so a Version 4 game writing plain
   text into its upper window looks like the screen it is part of,
   and the §8.2 status line -- reverse video from end to end --
   lands on the ink's chosen bar instead of inverting twice. */
.Style_user1 {
  background: var(--band);
  color: var(--band-ink);
}
.GridWindow {
  background: var(--paper);
  color: var(--ink);
}
.GridWindow .Style_user1 {
  background: var(--bar);
  color: var(--bar-ink);
}
.Style_blockquote {
  background: var(--quote);
}
/* The echoed line, once the machine has it: the display's own
   stylesheet dresses it a dark maroon, which is one ink's idea of
   emphasis and no other's. */
.Style_input {
  color: inherit;
}
/* And the field the player is still typing into. A form control
   does not inherit its colour from the page the way text does --
   browsers dress it from their own stylesheet instead, which is
   black whatever the story is wearing. So it is asked for
   explicitly, or a dark ink is typed into blind. The caret
   follows the colour, so it is answered by the same line. */
.Input {
  color: inherit;
  background: transparent;
}
.BufferWindow a,
.GridWindow a {
  color: var(--link);
}
/* Two corrections to the vendored stylesheet, kept here rather
   than in it, so that dropping in a newer GlkOte cannot quietly
   take them away again.

   The first refuses the rubber-band overscroll a WebKit engine
   does on macOS, where the whole page bounces past the end of the
   story. Both faces meet that engine there -- Safari in a tab, and
   the shell's own WKWebView -- and in a window with no browser
   chrome around it the bounce reads as a glitch rather than as
   scrolling.

   The second is the [MORE] prompt's rounded corners, which the
   vendored file asks for in the two vendor spellings of a decade
   ago and never in the standard one a current engine reads. */
:where(html, body) {
  overscroll-behavior-y: none;
}
.MorePrompt {
  border-radius: 4px;
}
/* The working light. The wire's burst model sends nothing back
   until the machine reaches its next wait, so a story that thinks
   for a long time leaves the page perfectly still, which reads as
   a dead interpreter rather than a busy one -- Dead Cities spends
   over a minute of real work opening itself. Almost every turn
   settles in milliseconds, though, so the chip waits before it
   appears: only a story that is genuinely thinking earns it. */
#working {
  position: fixed;
  bottom: 8px;
  left: 10px;
  z-index: 20;
  display: none;
  align-items: center;
  gap: 7px;
  font-family:
    monaco,
    "andale mono",
    "lucida console",
    courier,
    monospace;
  font-size: 13px;
  letter-spacing: 0.03em;
  color: var(--bar-ink);
  background: var(--bar);
  border-radius: 4px;
  padding: 6px 12px;
}
/* The seconds, once there are enough of them to be worth saying.
   A number that moves is proof of life in a way a still chip is
   not: it tells a reader whether to wait or to walk away. */
#working-for {
  font-variant-numeric: tabular-nums;
  opacity: 0.75;
}
#working[data-shown] {
  display: flex;
}
#working::before {
  content: "";
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: currentColor;
  animation: working-pulse 1.1s ease-in-out infinite;
}
@keyframes working-pulse {
  0%,
  100% {
    opacity: 0.25;
  }
  50% {
    opacity: 1;
  }
}
@media (prefers-reduced-motion: reduce) {
  #working::before {
    animation: none;
    opacity: 0.7;
  }
}
</style>
<script src="jquery-1.12.4.min.js" type="text/javascript"></script>
<script src="glkote.js" type="text/javascript"></script>
<script src="voxam-audio.js" type="text/javascript"></script>
<script type="text/javascript">
/* The Game interface object GlkOte drives: every event becomes
   one POST, and the response body is the update -- the burst
   model, one exchange per turn. Pictures arrive inline as data:
   urls in the update itself, so no Blorb interface is owed; the
   server's /pict road still answers by number for anyone who
   asks. Sounds ride the update the same way, in VOXAM's own
   dialect, played by voxam-audio.js -- whose finished plays come
   back through the same POST every other event takes. */
/* The working light, raised while the machine has the turn. The
   delay is the whole point: an ordinary turn answers long before
   it expires, so the chip never flashes, and a story that really
   is thinking gets to say so instead of looking dead. */
var VOXAM_WORKING_DELAY = 600;
var VOXAM_WORKING_TIMER = null;
var VOXAM_WORKING_TICK = null;

function voxamWorking(thinking) {
  var chip = document.getElementById("working");
  var counter = document.getElementById("working-for");
  var began = Date.now();

  function tell() {
    if (counter) {
      counter.textContent = " " + Math.round((Date.now() - began) / 1000) + "s";
    }
  }

  if (thinking) {
    if (VOXAM_WORKING_TIMER === null) {
      VOXAM_WORKING_TIMER = setTimeout(function() {
        if (chip) chip.setAttribute("data-shown", "");
        tell();
        VOXAM_WORKING_TICK = setInterval(tell, 1000);
      }, VOXAM_WORKING_DELAY);
    }

    return;
  }

  if (VOXAM_WORKING_TIMER !== null) {
    clearTimeout(VOXAM_WORKING_TIMER);
    VOXAM_WORKING_TIMER = null;
  }

  if (VOXAM_WORKING_TICK !== null) {
    clearInterval(VOXAM_WORKING_TICK);
    VOXAM_WORKING_TICK = null;
  }

  if (chip) chip.removeAttribute("data-shown");
  if (counter) counter.textContent = "";
}

var Game = {
  accept: function(event) {
    voxamWorking(true);

    fetch("/event", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(event)
    }).then(function(response) {
      return response.json();
    }).then(function(update) {
      voxamWorking(false);
      VoxamAudio.update(update);
      GlkOte.update(update);
    }).catch(function(fault) {
      voxamWorking(false);
      GlkOte.error("The session was lost: " + fault);
    });
  }
};
VoxamAudio.start(function(event) { Game.accept(event); });
</script>
</head>
<body onload="GlkOte.init();">
<div id="working" role="status" aria-live="polite">working<span id="working-for" aria-hidden="true"></span></div>
<div id="gameport">
<div id="windowport">
<noscript><p>You must have Javascript turned on to play.</p></noscript>
</div>
<div id="loadingpane">
<img src="waiting.gif" alt="LOADING"><br>
<em>Loading...</em>
</div>
<div id="errorpane" style="display:none;"><div id="errorcontent">...</div></div>
</div>

<script type="text/javascript">
/* The browser face keeps its choices in the tab's own storage,
   which is where the head script reads them next visit. */
VoxamPrefs.install({
  load: function() {
    try {
      return JSON.parse(localStorage.getItem("voxam-display") || "null");
    } catch (e) {
      return null;
    }
  },
  save: function(chosen) {
    try {
      localStorage.setItem("voxam-display", JSON.stringify(chosen));
    } catch (e) {
      /* A choice that cannot be kept still dresses this session. */
    }
  }
});
</script>
</body>
</html>
