<!doctype html>
<html lang="en" data-theme="system">
<head>
<meta charset="utf-8">
<title>VOXAM_TITLE</title>
<link rel="icon" href="favicon.ico" type="image/x-icon">
<link rel="stylesheet" href="glkote.css" type="text/css">
<script type="text/javascript">
/* Set the ink before the first paint, so a chosen theme never
   flashes the default first. The rest of the picker wiring waits
   for the body; this one line cannot. */
var VOXAM_INKS = ["paper", "sepia", "dark", "frotz"];
try {
  var VOXAM_SAVED = localStorage.getItem("voxam-theme");
  document.documentElement.setAttribute(
    "data-theme",
    VOXAM_INKS.indexOf(VOXAM_SAVED) >= 0 ? VOXAM_SAVED : "system"
  );
} catch (e) {
  /* Private mode, blocked storage: the default ink stands. */
}
</script>
<style type="text/css">
/* The inks. "paper" is the default and what a light system wears
   under "system"; a dark system swaps in the dark palette unless
   a theme was picked outright. Each ink is a whole dress -- page,
   window, the reverse video §8.7 sends as user1, and the §8.2
   status bar.

   The bar names its own pair rather than inverting the story's.
   Deriving it by inversion looks right until the upper window is
   itself dressed as the story's inverse: the status line is
   reverse video from end to end, so it inverts a second time and
   lands back on the story's own colours -- which is how the sepia
   bar came to be pixel-for-pixel identical to the prose beneath
   it. So --bar and --bar-ink are chosen per ink, the way WinFrotz
   chooses white on blue, and the grid itself simply wears the
   story's paper, because an upper window is part of the same
   screen. */
:root {
  --page: #444;
  --paper: #fff;
  --ink: #000;
  --band: #333;
  --band-ink: #fff;
  --bar: #2b2b2b;
  --bar-ink: #f2f2f2;
  --quote: #fff0c0;
  --link: #1a5fb4;
}
@media (prefers-color-scheme: dark) {
  html[data-theme="system"] {
    --page: #111;
    --paper: #1c1c1c;
    --ink: #d6d6d6;
    --band: #d6d6d6;
    --band-ink: #1c1c1c;
    --bar: #a8a8a8;
    --bar-ink: #141414;
    --quote: #ffffff14;
    --link: #8ab4f8;
  }
}
html[data-theme="dark"] {
  --page: #111;
  --paper: #1c1c1c;
  --ink: #d6d6d6;
  --band: #d6d6d6;
  --band-ink: #1c1c1c;
  --bar: #a8a8a8;
  --bar-ink: #141414;
  --quote: #ffffff14;
  --link: #8ab4f8;
}
html[data-theme="sepia"] {
  --page: #2f2921;
  --paper: #f4ecd8;
  --ink: #43382a;
  --band: #43382a;
  --band-ink: #f4ecd8;
  --bar: #43382a;
  --bar-ink: #f4ecd8;
  --quote: #0000000f;
  --link: #7a5326;
}
/* The DOS Infocom look, which WinFrotz still opens in: white on a
   deep blue, and the status bar its exact inverse. The one ink
   here that is a period piece rather than a reading preference. */
html[data-theme="frotz"] {
  --page: #000042;
  --paper: #000084;
  --ink: #fff;
  --band: #fff;
  --band-ink: #000084;
  --bar: #fff;
  --bar-ink: #000084;
  --quote: #ffffff1f;
  --link: #7ec8ff;
}
html, body {
  margin: 0;
  height: 100%;
  background: var(--page);
}
#gameport {
  position: absolute;
  overflow: hidden;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 900px;
  top: 0;
  bottom: 0;
  background: var(--paper);
  color: var(--ink);
}
/* GlkOte's own stylesheet paints windows a hardcoded cream; the
   theme's paper wins here. */
.WindowFrame {
  background: var(--paper);
}
.GraphicsWindow canvas {
  background-color: var(--paper);
}
/* The Z-Machine's reverse video (§8.7) travels as user1. In the
   buffer it inverts the story, as reverse video should. The grid
   wears the story's own paper, so a Version 4 game writing plain
   text into its upper window looks like the screen it is part of,
   and the §8.2 status line -- reverse video from end to end --
   lands on the ink's chosen bar instead of inverting twice. */
.Style_user1 {
  background: var(--band);
  color: var(--band-ink);
}
.GridWindow {
  background: var(--paper);
  color: var(--ink);
}
.GridWindow .Style_user1 {
  background: var(--bar);
  color: var(--bar-ink);
}
.Style_blockquote {
  background: var(--quote);
}
.Style_input {
  color: inherit;
}
.BufferWindow a,
.GridWindow a {
  color: var(--link);
}
/* The working light. The wire's burst model sends nothing back
   until the machine reaches its next wait, so a story that thinks
   for a long time leaves the page perfectly still, which reads as
   a dead interpreter rather than a busy one -- Dead Cities spends
   over a minute of real work opening itself. Almost every turn
   settles in milliseconds, though, so the chip waits before it
   appears: only a story that is genuinely thinking earns it. */
#working {
  position: fixed;
  bottom: 8px;
  left: 10px;
  z-index: 20;
  display: none;
  align-items: center;
  gap: 7px;
  font-family:
    monaco,
    "andale mono",
    "lucida console",
    courier,
    monospace;
  font-size: 11px;
  letter-spacing: 0.03em;
  color: var(--bar-ink);
  background: var(--bar);
  border-radius: 3px;
  padding: 3px 10px;
}
#working[data-shown] {
  display: flex;
}
#working::before {
  content: "";
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: currentColor;
  animation: working-pulse 1.1s ease-in-out infinite;
}
@keyframes working-pulse {
  0%,
  100% {
    opacity: 0.25;
  }
  50% {
    opacity: 1;
  }
}
@media (prefers-reduced-motion: reduce) {
  #working::before {
    animation: none;
    opacity: 0.7;
  }
}
/* The theme picker: dressed as a small status-bar chip -- the
   reverse-video colours the interface already wears, the grid's
   own monospace -- so it reads as furniture, not an OS control.
   Bottom-right, clear of the score and the input prompt, and
   faint until it is wanted. */
#theme-pick {
  position: fixed;
  bottom: 8px;
  right: 10px;
  z-index: 20;
  opacity: 0.4;
  transition: opacity 0.15s ease;
}
#theme-pick:hover,
#theme-pick:focus-within {
  opacity: 1;
}
#theme-pick::after {
  content: "\25be";
  position: absolute;
  right: 8px;
  top: 50%;
  transform: translateY(-50%);
  pointer-events: none;
  font-size: 10px;
  color: var(--band-ink);
}
#theme-pick select {
  -webkit-appearance: none;
  appearance: none;
  font-family:
    monaco,
    "andale mono",
    "lucida console",
    courier,
    monospace;
  font-size: 11px;
  letter-spacing: 0.03em;
  color: var(--band-ink);
  background: var(--band);
  border: 0;
  border-radius: 3px;
  padding: 3px 22px 3px 9px;
  cursor: pointer;
}
#theme-pick select:focus-visible {
  outline: 2px solid var(--link);
  outline-offset: 1px;
}
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
}
</style>
<script src="jquery-1.12.4.min.js" type="text/javascript"></script>
<script src="glkote.js" type="text/javascript"></script>
<script src="voxam-audio.js" type="text/javascript"></script>
<script type="text/javascript">
/* The Game interface object GlkOte drives: every event becomes
   one POST, and the response body is the update -- the burst
   model, one exchange per turn. Pictures arrive inline as data:
   urls in the update itself, so no Blorb interface is owed; the
   server's /pict road still answers by number for anyone who
   asks. Sounds ride the update the same way, in VOXAM's own
   dialect, played by voxam-audio.js -- whose finished plays come
   back through the same POST every other event takes. */
/* The working light, raised while the machine has the turn. The
   delay is the whole point: an ordinary turn answers long before
   it expires, so the chip never flashes, and a story that really
   is thinking gets to say so instead of looking dead. */
var VOXAM_WORKING_DELAY = 600;
var VOXAM_WORKING_TIMER = null;

function voxamWorking(thinking) {
  var chip = document.getElementById("working");

  if (thinking) {
    if (VOXAM_WORKING_TIMER === null) {
      VOXAM_WORKING_TIMER = setTimeout(function() {
        if (chip) chip.setAttribute("data-shown", "");
      }, VOXAM_WORKING_DELAY);
    }

    return;
  }

  if (VOXAM_WORKING_TIMER !== null) {
    clearTimeout(VOXAM_WORKING_TIMER);
    VOXAM_WORKING_TIMER = null;
  }

  if (chip) chip.removeAttribute("data-shown");
}

var Game = {
  accept: function(event) {
    voxamWorking(true);

    fetch("/event", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(event)
    }).then(function(response) {
      return response.json();
    }).then(function(update) {
      voxamWorking(false);
      VoxamAudio.update(update);
      GlkOte.update(update);
    }).catch(function(fault) {
      voxamWorking(false);
      GlkOte.error("The session was lost: " + fault);
    });
  }
};
VoxamAudio.start(function(event) { Game.accept(event); });
</script>
</head>
<body onload="GlkOte.init();">
<div id="working" role="status" aria-live="polite">working</div>
<label id="theme-pick">
<span class="sr-only">Theme</span>
<select id="theme">
<option value="system">System</option>
<option value="paper">Paper</option>
<option value="sepia">Sepia</option>
<option value="dark">Dark</option>
<option value="frotz">Frotz</option>
</select>
</label>
<div id="gameport">
<div id="windowport">
<noscript><p>You must have Javascript turned on to play.</p></noscript>
</div>
<div id="loadingpane">
<img src="waiting.gif" alt="LOADING"><br>
<em>Loading...</em>
</div>
<div id="errorpane" style="display:none;"><div id="errorcontent">...</div></div>
</div>
<script type="text/javascript">
/* The picker follows the head script: it shows what is already
   worn and writes any change back to storage, where the head
   script reads it next visit. */
(function() {
  var pick = document.getElementById("theme");

  pick.value = document.documentElement.getAttribute("data-theme");

  pick.addEventListener("change", function() {
    document.documentElement.setAttribute("data-theme", pick.value);

    try {
      localStorage.setItem("voxam-theme", pick.value);
    } catch (e) {
      /* A choice that cannot be kept still dresses this session. */
    }
  });
})();
</script>
</body>
</html>
