[package]
name = "voxam-desktop"
# Scaffold version: the bundler reads tauri.conf.json's, which
# `cz bump` keeps in step with the repo's own.
version = "0.1.0"
description = "The Voxam desktop shell"
edition = "2021"
license = "MIT"

[lib]
name = "voxam_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
