<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Voxam</title>
<link rel="stylesheet" href="glkote.css" type="text/css">
<style type="text/css">
/* The Display menu's knobs, worn as variables the dresser sets:
   the story's type and size, and the measure of its column. */
:root {
  --story-face: Palatino, Georgia, "Times New Roman", Times, serif;
  --story-size: 15px;
  --grid-size: 14px;
  --measure: 900px;
}
html, body {
  margin: 0;
  height: 100%;
}
#gameport {
  position: absolute;
  overflow: hidden;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: var(--measure);
  top: 0;
  bottom: 0;
}
.BufferWindow, .BufferWindow .Input {
  font-family: var(--story-face);
  font-size: var(--story-size);
}
.GridWindow, .GridWindow .Input {
  font-size: var(--grid-size);
}
.Input {
  color: inherit;
  background: transparent;
}
/* The inks, each a whole dress: page, story, the reverse video
   §8.7 sends as user1, and the §8.2 status bar.

   The bar names its own pair rather than inverting the story's.
   Deriving it by inversion looks right until the upper window is
   itself dressed as the story's inverse: the status line is
   reverse video from end to end, so it inverts a second time and
   lands back on the story's own colours -- which is how the sepia
   bar came to be pixel-for-pixel identical to the prose beneath
   it. So each ink chooses its bar, the way WinFrotz chooses white
   on blue, and the grid simply wears the story's paper, because
   an upper window is part of the same screen. These inks are the
   browser face's own, in src/voxam/pages/index.html: the two
   files are written separately and have to move together. */
body.theme-paper {
  background: #444;
}
body.theme-paper #gameport {
  background: white;
  color: black;
}
body.theme-paper .Style_user1 {
  background: #333;
  color: #fff;
}
body.theme-paper .GridWindow {
  background: white;
  color: black;
}
body.theme-paper .GridWindow .Style_user1 {
  background: #2b2b2b;
  color: #f2f2f2;
}
body.theme-sepia {
  background: #2f2921;
}
body.theme-sepia #gameport {
  background: #f4ecd8;
  color: #43382a;
}
body.theme-sepia .Style_user1 {
  background: #43382a;
  color: #f4ecd8;
}
body.theme-sepia .GridWindow {
  background: #f4ecd8;
  color: #43382a;
}
body.theme-sepia .GridWindow .Style_user1 {
  background: #43382a;
  color: #f4ecd8;
}
body.theme-dark {
  background: #111;
}
body.theme-dark #gameport {
  background: #1c1c1c;
  color: #d6d6d6;
}
body.theme-dark .Style_user1 {
  background: #d6d6d6;
  color: #1c1c1c;
}
body.theme-dark .GridWindow {
  background: #1c1c1c;
  color: #d6d6d6;
}
body.theme-dark .GridWindow .Style_user1 {
  background: #a8a8a8;
  color: #141414;
}
/* The DOS Infocom look, which WinFrotz still opens in: white on a
   deep blue, and the status bar its exact inverse. The one ink
   here that is a period piece rather than a reading preference. */
body.theme-frotz {
  background: #000042;
}
body.theme-frotz #gameport {
  background: #000084;
  color: #fff;
}
body.theme-frotz .Style_user1 {
  background: #fff;
  color: #000084;
}
body.theme-frotz .GridWindow {
  background: #000084;
  color: #fff;
}
body.theme-frotz .GridWindow .Style_user1 {
  background: #fff;
  color: #000084;
}
/* The working light. The pipe carries nothing back until the
   machine reaches its next wait, so a story that thinks for a
   long time leaves the window perfectly still, which reads as a
   dead interpreter rather than a busy one. Almost every turn
   settles in milliseconds, so the chip waits before appearing:
   only a story genuinely thinking earns it. Its colours are the
   status bar's, per ink, the way the browser face does it. */
#working {
  position: fixed;
  bottom: 8px;
  left: 10px;
  z-index: 20;
  display: none;
  align-items: center;
  gap: 7px;
  font-size: 11px;
  letter-spacing: 0.03em;
  border-radius: 3px;
  padding: 3px 10px;
  background: #2b2b2b;
  color: #f2f2f2;
}
body.theme-sepia #working {
  background: #43382a;
  color: #f4ecd8;
}
body.theme-dark #working {
  background: #a8a8a8;
  color: #141414;
}
body.theme-frotz #working {
  background: #fff;
  color: #000084;
}
#working[data-shown] {
  display: flex;
}
#working::before {
  content: "";
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: currentColor;
  animation: working-pulse 1.1s ease-in-out infinite;
}
@keyframes working-pulse {
  0%,
  100% {
    opacity: 0.25;
  }
  50% {
    opacity: 1;
  }
}
@media (prefers-reduced-motion: reduce) {
  #working::before {
    animation: none;
    opacity: 0.7;
  }
}
/* The landing overlay covers the gameport but never hides it:
   GlkOte must measure real geometry the moment it initializes. */
#landing {
  position: absolute;
  inset: 0;
  z-index: 10;
  background: #444;
  color: #ddd;
  font-family: Georgia, serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 0.75em;
  text-align: center;
}
#landing h1 {
  font-size: 3em;
  letter-spacing: 0.15em;
  color: #0bf;
  margin: 0;
}
#landing p {
  margin: 0;
}
#landing button {
  font-size: 1.1em;
  padding: 0.5em 1.5em;
  margin-top: 1em;
  cursor: pointer;
}
#landing .note {
  max-width: 34em;
  margin-top: 1.5em;
  color: #f9a;
  white-space: pre-wrap;
  font-family: monospace;
  text-align: left;
}
#endedbar {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 9;
  display: none;
  background: #222;
  color: #eee;
  font-family: Georgia, serif;
  padding: 0.6em;
  text-align: center;
}
#endedbar button {
  margin-left: 1em;
  cursor: pointer;
}
</style>
<script src="jquery-1.12.4.min.js" type="text/javascript"></script>
<script src="glkote.js" type="text/javascript"></script>
<script src="voxam-audio.js" type="text/javascript"></script>
<script src="shell.js" type="text/javascript"></script>
</head>
<body class="theme-paper">
<div id="gameport">
<div id="windowport">
<noscript><p>You must have Javascript turned on to play.</p></noscript>
</div>
<div id="loadingpane">
<img src="waiting.gif" alt="LOADING"><br>
<em>Loading...</em>
</div>
<div id="errorpane" style="display:none;"><div id="errorcontent">...</div></div>
</div>
<div id="landing">
<h1>V&Theta;X&Delta;M</h1>
<p>An interpreter for Z-Machine and Glulx stories.</p>
<button id="open">Open a Story&hellip;</button>
<div class="note" id="note"></div>
</div>
<div id="working" role="status" aria-live="polite">working</div>
<div id="endedbar">The story has ended.<button id="reopen">Open another&hellip;</button></div>
</body>
</html>
