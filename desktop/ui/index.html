<!doctype html>
<html lang="en" data-theme="paper">
<head>
<meta charset="utf-8">
<title>Voxam</title>
<link rel="stylesheet" href="glkote.css" type="text/css">
<style type="text/css">
/* The Display menu's knobs, worn as variables the dresser sets:
   the story's type and size, and the measure of its column. */
:root {
  --story-face: Palatino, Georgia, "Times New Roman", Times, serif;
  --story-size: 15px;
  --grid-size: 14px;
  --measure: 900px;
}
html, body {
  margin: 0;
  height: 100%;
  background: var(--page);
}
#gameport {
  position: absolute;
  overflow: hidden;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: var(--measure);
  top: 0;
  bottom: 0;
  background: var(--paper);
  color: var(--ink);
}
.BufferWindow, .BufferWindow .Input {
  font-family: var(--story-face);
  font-size: var(--story-size);
}
.GridWindow, .GridWindow .Input {
  font-size: var(--grid-size);
}
.Input {
  color: inherit;
  background: transparent;
}
/* The inks, each a whole dress, worn as the nine properties the
   browser face names them by: the page behind the story, the
   story's own paper and ink, the reverse video §8.7 sends as
   user1, the §8.2 status bar, a quotation's ground, and a link.

   The bar names its own pair rather than inverting the story's.
   Deriving it by inversion looks right until the upper window is
   itself dressed as the story's inverse: the status line is
   reverse video from end to end, so it inverts a second time and
   lands back on the story's own colours -- which is how the sepia
   bar came to be pixel-for-pixel identical to the prose beneath
   it. So each ink chooses its bar, the way WinFrotz chooses white
   on blue, and the grid simply wears the story's paper, because
   an upper window is part of the same screen.

   These are the browser face's own values under its own property
   names, from src/voxam/pages/index.html. The two files are
   written separately and have to move together, so they are kept
   in one shape: a divergence should be visible by reading them
   side by side. */
:root {
  --page: #444;
  --paper: #fff;
  --ink: #000;
  --band: #333;
  --band-ink: #fff;
  --bar: #2b2b2b;
  --bar-ink: #f2f2f2;
  --quote: #fff0c0;
  --link: #1a5fb4;
}
html[data-theme="sepia"] {
  --page: #2f2921;
  --paper: #f4ecd8;
  --ink: #43382a;
  --band: #43382a;
  --band-ink: #f4ecd8;
  --bar: #43382a;
  --bar-ink: #f4ecd8;
  --quote: #0000000f;
  --link: #7a5326;
}
html[data-theme="dark"] {
  --page: #111;
  --paper: #1c1c1c;
  --ink: #d6d6d6;
  --band: #d6d6d6;
  --band-ink: #1c1c1c;
  --bar: #a8a8a8;
  --bar-ink: #141414;
  --quote: #ffffff14;
  --link: #8ab4f8;
}
/* The DOS Infocom look, which WinFrotz still opens in: white on a
   deep blue, and the status bar its exact inverse. The one ink
   here that is a period piece rather than a reading preference. */
html[data-theme="frotz"] {
  --page: #000042;
  --paper: #000084;
  --ink: #fff;
  --band: #fff;
  --band-ink: #000084;
  --bar: #fff;
  --bar-ink: #000084;
  --quote: #ffffff1f;
  --link: #7ec8ff;
}
/* And what wears them. GlkOte's own stylesheet paints window
   frames, quotations, and the echoed line in fixed colours of its
   own, which are one ink's idea of the page and no other's; the
   theme wins here, exactly as it does in the browser face. */
.WindowFrame {
  background: var(--paper);
}
.GraphicsWindow canvas {
  background-color: var(--paper);
}
.Style_user1 {
  background: var(--band);
  color: var(--band-ink);
}
.GridWindow {
  background: var(--paper);
  color: var(--ink);
}
.GridWindow .Style_user1 {
  background: var(--bar);
  color: var(--bar-ink);
}
.Style_blockquote {
  background: var(--quote);
}
.Style_input {
  color: inherit;
}
.BufferWindow a,
.GridWindow a {
  color: var(--link);
}
/* The working light. The pipe carries nothing back until the
   machine reaches its next wait, so a story that thinks for a
   long time leaves the window perfectly still, which reads as a
   dead interpreter rather than a busy one. Almost every turn
   settles in milliseconds, so the chip waits before appearing:
   only a story genuinely thinking earns it. Its colours are the
   status bar's, per ink, the way the browser face does it. */
#working {
  position: fixed;
  bottom: 8px;
  left: 10px;
  z-index: 20;
  display: none;
  align-items: center;
  gap: 7px;
  font-size: 13px;
  letter-spacing: 0.03em;
  border-radius: 4px;
  padding: 6px 12px;
  background: var(--bar);
  color: var(--bar-ink);
}
/* The seconds, once there are enough of them to be worth saying.
   A number that moves is proof of life in a way a still chip is
   not: it tells a reader whether to wait or to walk away. */
#working-for {
  font-variant-numeric: tabular-nums;
  opacity: 0.75;
}
#working[data-shown] {
  display: flex;
}
#working::before {
  content: "";
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: currentColor;
  animation: working-pulse 1.1s ease-in-out infinite;
}
@keyframes working-pulse {
  0%,
  100% {
    opacity: 0.25;
  }
  50% {
    opacity: 1;
  }
}
@media (prefers-reduced-motion: reduce) {
  #working::before {
    animation: none;
    opacity: 0.7;
  }
}
/* The landing overlay covers the gameport but never hides it:
   GlkOte must measure real geometry the moment it initializes. */
#landing {
  position: absolute;
  inset: 0;
  z-index: 10;
  background: #444;
  color: #ddd;
  font-family: Georgia, serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 0.75em;
  text-align: center;
}
#landing h1 {
  font-size: 3em;
  letter-spacing: 0.15em;
  color: #0bf;
  margin: 0;
}
#landing p {
  margin: 0;
}
#landing button,
#endedbar button {
  font-size: 1.05em;
  font-family: inherit;
  padding: 0.55em 1.6em;
  border-radius: 4px;
  cursor: pointer;
}
#landing button {
  margin-top: 1em;
}
#landing .note {
  max-width: 34em;
  margin-top: 1.5em;
  color: #f9a;
  white-space: pre-wrap;
  font-family: monospace;
  text-align: left;
}
#endedbar {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 9;
  display: none;
  background: #222;
  color: #eee;
  font-family: Georgia, serif;
  padding: 0.6em;
  text-align: center;
}
#endedbar button {
  margin-left: 1em;
}
</style>
<script src="jquery-1.12.4.min.js" type="text/javascript"></script>
<script src="glkote.js" type="text/javascript"></script>
<script src="voxam-audio.js" type="text/javascript"></script>
<script src="shell.js" type="text/javascript"></script>
</head>
<body>
<div id="gameport">
<div id="windowport">
<noscript><p>You must have Javascript turned on to play.</p></noscript>
</div>
<div id="loadingpane">
<img src="waiting.gif" alt="LOADING"><br>
<em>Loading...</em>
</div>
<div id="errorpane" style="display:none;"><div id="errorcontent">...</div></div>
</div>
<div id="landing">
<h1>V&Theta;X&Delta;M</h1>
<p>An interpreter for Z-Machine and Glulx stories.</p>
<button id="open">Open a Story&hellip;</button>
<div class="note" id="note"></div>
</div>
<div id="working" role="status" aria-live="polite">working<span id="working-for" aria-hidden="true"></span></div>
<div id="endedbar">The story has ended.<button id="reopen">Open another&hellip;</button></div>
</body>
</html>
