name: Desktop

# The shell's installers, one per platform. The release chain
# calls this on every version tag and attaches what it builds;
# dispatching it by hand is a dry run whose artifacts stay on the
# workflow run. The artifacts are unsigned -- signing is its own
# road, with its own certificates.
on:
  workflow_dispatch:
  workflow_call:

jobs:
  installers:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            bundles: nsis
            built: desktop/src-tauri/target/release/bundle/nsis/*.exe
          - name: macos
            os: macos-latest
            bundles: dmg
            flags: --target universal-apple-darwin
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            built: desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - name: linux
            os: ubuntu-latest
            bundles: deb,appimage
            built: |
              desktop/src-tauri/target/release/bundle/deb/*.deb
              desktop/src-tauri/target/release/bundle/appimage/*.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - name: Cache the Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      # The webview itself: Tauri renders through WebKitGTK on
      # Linux, where nothing ships it by default.
      - name: Install the webview's Linux underpinnings
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf

      - name: Install the Tauri CLI
        working-directory: desktop
        run: npm ci

      - name: Build the installers
        working-directory: desktop
        run: npx tauri build --bundles ${{ matrix.bundles }} ${{ matrix.flags }}

      - name: Keep the installers
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.name }}
          path: ${{ matrix.built }}
          if-no-files-found: error
