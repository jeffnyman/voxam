name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"
  UV_FROZEN: "1"

permissions:
  contents: read

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install the project
        run: uv sync --all-groups

      - name: Ruff (lint)
        run: uv run ruff check --output-format=github .

      - name: Ruff (format)
        run: uv run ruff format --check --diff .

      - name: mypy
        run: uv run mypy

  test:
    name: Test on ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install the project
        run: uv sync --all-groups

      - name: Run tests
        run: uv run pytest

  # The cross-certification: every certified RegTest script must
  # pass under Voxam's in-process runner AND under the vendored
  # reference implementation driving `voxam --plain` through pipes
  # -- same file, same verdict. The reference's cheap mode is
  # POSIX-only, which is one reason the built-in runner exists;
  # this job is where the two are held to agreement. It fetches
  # the entharion submodule because the zork1 script plays a real
  # game -- and because the Glulx certification below plays
  # glulxercise; arthur.regtest runs under the built-in runner
  # alone (the reference's prompt framing cannot follow a
  # keystroke prompt).
  regtest:
    name: RegTest cross-certification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install the project
        run: uv sync --all-groups

      - name: Certified scripts under the built-in runner
        run: |
          uv run voxam --regtest regtest/fixtures.regtest
          uv run voxam --regtest regtest/zork1.regtest

      - name: Certified scripts under the reference
        run: |
          uv run python regtest/reference/regtest.py --timeout 10 regtest/fixtures.regtest
          uv run python regtest/reference/regtest.py --timeout 10 regtest/zork1.regtest

      - name: Arthur, beyond the reference's reach
        run: uv run voxam --regtest regtest/arthur.regtest

      # CZECH prints its whole verdict at boot and never prompts,
      # which puts it beyond the regtest format's reach -- so the
      # certification asserts its closing tallies directly, exact
      # passed counts included, at every version the checker ships.
      - name: CZECH, certified at every version on the shelf
        run: |
          declare -A passed=( [3]=349 [4]=367 [5]=406 [8]=406 )
          for v in 3 4 5 8; do
            out="$(uv run voxam --plain --seed 7 "entharion/zcode-checkers/czech/czech.z$v")"
            echo "$out" | tail -4
            echo "$out" | grep -q "Passed: ${passed[$v]}, Failed: 0, Print tests: 19"
            echo "$out" | grep -q "Didn't crash: hooray!"
          done

      # Glulxercise is CZECH's Glulx counterpart: one "all" runs
      # every section, and the certification asserts the exact
      # tally -- 70 sections passed, no failures, and the closing
      # verdict spoken -- through the same stdio session a player
      # would use.
      #
      # --seed 777 pins the whole battery, RandomTest included.
      # That section reseeds to entropy itself (`@setrandom 0`)
      # and then checks its histogram against wide but finite
      # bounds, warning in its own words that it "may, very
      # occasionally, fail through sheer bad luck" -- which twice
      # read as a phantom regression on a green change. Under an
      # explicit --seed the reseed now draws off the seeded stream
      # instead (#316), so the run is byte-identical every time and
      # the retry loop that stood here is no longer earning its
      # keep.
      - name: Glulxercise, the whole battery
        run: |
          out="$(echo all | uv run voxam --seed 777 entharion/glulx-checkers/glulxercise-r13-s241202.ulx)"
          echo "$out" | tail -3
          test "$(echo "$out" | grep -c '^Passed\.$')" -eq 70
          echo "$out" | grep -q "All tests passed."
          ! echo "$out" | grep -q "FAILED"

      # The acceptance corpus, smoke-tested. Seventeen of the
      # forty-five recordings, chosen because they execute every
      # line of voxam the whole corpus executes and cover every
      # story file version besides; the list and the measurement
      # behind it are in the tool. This asks only whether real games
      # still play: a crash, a hang, or a story that no longer opens
      # fails the job.
      #
      # It does not ask whether they play the SAME, which is the
      # question the whole corpus answers by comparing two sweeps.
      # That one wants a human reading the diff, and lives at
      # release time rather than here.
      #
      # It rides this job because the story corpus is already
      # checked out here for CZECH and glulxercise above, so it
      # costs the replay and nothing else.
      - name: The acceptance corpus, smoke-tested
        run: uv run python tools/sweep-corpus.py record sweep --subset

  # The C# port under csharp/: formatted, built with warnings as
  # errors, tested at its coverage threshold, and published NativeAOT
  # on each platform, since AOT cannot cross-compile across operating
  # systems and a binary that links on one is no evidence about the
  # others. Where the corpus is fetched, the native binary then
  # replays Zork I and must match the Python byte for byte: the
  # certification the sweep tool performs, in miniature.
  csharp:
    name: C# port on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: csharp/global.json

      - name: Format
        run: dotnet format csharp --verify-no-changes

      - name: Build
        run: dotnet build csharp -c Release

      - name: Test at the coverage threshold
        run: dotnet test csharp -c Release --no-build

      - name: Publish NativeAOT
        run: dotnet publish csharp/Voxam.Cli -c Release -o csharp/publish

      - name: Publish the desktop through NativeAOT
        run: dotnet publish csharp/Voxam.Desktop -c Release -o csharp/publish-desktop

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install the project
        run: uv sync --all-groups

      # One recording from each machine, since the port runs both.
      # Adventure is the Glulx side's own oldest witness, and its
      # transcript exercises the whole stack the Z-Machine one does not:
      # the dispatch layer, the library, and the plain display.
      #
      # Both transcripts go to files, so a bare comparison would fail in
      # silence and leave a red job saying nothing at all. Each run is
      # therefore checked for itself first, and a difference is shown
      # rather than merely reported.
      - name: One recording from each machine, byte for byte
        shell: bash
        run: |
          set -o pipefail

          for name in zork1-r88-s840726 advent-r5-s961209-glulx; do
            echo "== $name"

            if ! uv run voxam --accept "acceptance/$name.accept" > reference.txt; then
              echo "the reference itself would not replay $name"
              tail -20 reference.txt
              exit 1
            fi

            if ! csharp/publish/voxam --accept "acceptance/$name.accept" > port.txt; then
              echo "the port would not replay $name"
              tail -20 port.txt
              exit 1
            fi

            if ! diff -u reference.txt port.txt | head -40; then
              exit 1
            fi

            if ! cmp -s reference.txt port.txt; then
              echo "$name differs; the diff is above"
              exit 1
            fi

            wc -l reference.txt
          done

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Build sdist and wheel
        run: uv build

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  # The ruleset on main requires a single status check named "ci". Workflow
  # names never report a status — jobs do — so this gate job carries that name,
  # waits on every other job, and fails unless all of them succeeded. It also
  # gives branch protection one stable check to require no matter how the test
  # matrix changes.
  ci:
    name: ci
    runs-on: ubuntu-latest
    needs: [lint, test, regtest, csharp, build]
    if: always()
    steps:
      - name: Fail if any needed job failed, was cancelled, or was skipped
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
