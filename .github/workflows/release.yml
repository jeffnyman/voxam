name: Release

# A release is a pushed v* tag on main. The pipeline mirrors the
# manual runbook: build and audit the artifacts, smoke-test the
# built wheel in a clean environment, then wait at the pypi
# environment gate for a human "Approve and deploy" before
# publishing to PyPI and cutting the GitHub release.
#
# The publish job authenticates with PyPI trusted publishing
# (OIDC): no tokens exist anywhere. The service is configured with
# a trusted publisher bound to this repository, this file's name,
# and its environment name.
#
# TestPyPI was once a stop on this chain and earned its removal:
# its simple-index CDN serves a stale version list for minutes
# after an upload, so a smoke install racing it failed release
# after release while the uploaded files were live the whole time.
# The wheel smoke below proves the same thing -- the shipped
# artifact installs and runs clean -- with nothing to race.

on:
  push:
    tags: ["v*"]

env:
  FORCE_COLOR: "1"
  UV_FROZEN: "1"

permissions:
  contents: read

jobs:
  build:
    name: Build and audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install the project
        run: uv sync --all-groups

      # Insurance on the exact tagged commit, cheap at this suite's speed.
      - name: Run tests
        run: uv run pytest

      - name: Build sdist and wheel
        run: uv build

      - name: Validate long description
        run: uvx twine check dist/*

      # The copyright audit: the artifacts may contain nothing beyond
      # the package sources and project files. The reference submodule
      # and the acceptance recordings must never ship.
      - name: Audit artifact contents
        run: |
          python - <<'AUDIT'
          import glob, re, sys, tarfile, zipfile

          PROJECT_FILES = {
              "PKG-INFO", "pyproject.toml", "pyproject.toml.orig",
              "LICENSE", "README.md", "src", "src/voxam",
          }

          def sdist_ok(name: str) -> bool:
              inner = re.sub(r"^voxam-[^/]+/?", "", name)
              return (
                  inner in PROJECT_FILES
                  or inner == ""
                  or inner.startswith("src/voxam/")
              )

          def wheel_ok(name: str) -> bool:
              return name.startswith("voxam/") or re.match(
                  r"^voxam-[^/]+\.dist-info/", name
              )

          bad = [
              n for n in zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
              if not wheel_ok(n)
          ] + [
              m.name for m in tarfile.open(glob.glob("dist/*.tar.gz")[0]).getmembers()
              if not sdist_ok(m.name)
          ]

          if bad:
              print("unexpected files in distribution artifacts:")
              for name in bad:
                  print(" ", name)
              sys.exit(1)
          print("artifact contents are exactly the package")
          AUDIT

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  smoke:
    name: Smoke test the built wheel
    runs-on: ubuntu-latest
    needs: build
    steps:
      # The checkout supplies the story-file fixture the smoke run plays.
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      # The exact bytes the pypi publish will ship, installed into
      # a clean environment -- deterministic, so a failure here is
      # always ours.
      - name: Install the built wheel
        run: pip install dist/voxam-*.whl

      - name: Play a story with the installed package
        run: |
          voxam tests/fixtures/simple-test-r1-s260727.z3 | tee smoke.txt
          grep -q "hello from all z machine versions" smoke.txt

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: smoke
    environment:
      name: pypi
      url: https://pypi.org/p/voxam
    permissions:
      id-token: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1

  # The desktop shell's installers, built by the shared workflow;
  # its artifacts land in this run for the release to attach. The
  # two artifact streams share the tag and the version -- one
  # release tells one story.
  desktop:
    name: Desktop installers
    uses: ./.github/workflows/desktop.yml

  github-release:
    name: Cut the GitHub release
    runs-on: ubuntu-latest
    needs: [publish-pypi, desktop]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Download the installers
        uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          path: installers/
          merge-multiple: true

      # The release notes are this version's section of the
      # commitizen-maintained changelog.
      - name: Extract changelog section
        run: |
          python - <<'NOTES'
          import os, pathlib, re

          version = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          match = re.search(
              rf"^## v{re.escape(version)}.*?(?=^## v|\Z)",
              text,
              re.MULTILINE | re.DOTALL,
          )
          notes = match.group(0) if match else f"Release {version}"
          pathlib.Path("notes.md").write_text(notes, encoding="utf-8")
          NOTES

      # Files only, whatever shape any artifact arrives in: the
      # v1.9.0 release fell at this step when a glob handed gh a
      # directory instead of an installer.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* $(find installers -type f) \
            --title "$GITHUB_REF_NAME" --notes-file notes.md
